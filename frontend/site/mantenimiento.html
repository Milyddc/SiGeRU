<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento | SiGeRU</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="estilo-extra.css">
</head>
<body>

<video class="video-fondo" autoplay muted loop playsinline>
    <source src="video/montevideo.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<header>
    <div class="logo">
        <a href="/">
            <img class="logo-img" src="sigerulogo.png" alt="SiGeRU">
        </a>
    </div>

    <nav></nav>
</header>

<section class="page-container">

    <div class="page-header">
        <h2>Mantenimiento de camiones</h2>
        <a href="camiones.html" class="btn-add">Volver a camiones</a>
    </div>

    <form id="mantenimientoForm" class="form-ruta">

        <div class="input-group">
            <label for="id_camion">Camión</label>
            <select id="id_camion" required>
                <option value="">Seleccione un camión</option>
            </select>
        </div>

        <div class="input-group">
            <label for="tipo">Tipo</label>
            <select id="tipo">
                <option value="Preventivo">Preventivo</option>
                <option value="Correctivo">Correctivo</option>
            </select>
        </div>

        <div class="input-group">
            <label for="fecha_programada">Fecha programada</label>
            <input type="date" id="fecha_programada" required>
        </div>

        <div class="input-group">
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" maxlength="255" required placeholder="Cambio de aceite, frenos...">
        </div>

        <div class="acciones">
            <button type="submit" class="btn-login">Programar</button>
        </div>

    </form>

    <table>
        <thead>
            <tr>
                <th>Camión</th>
                <th>Tipo</th>
                <th>Descripción</th>
                <th>Programado</th>
                <th>Realizado</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaMantenimientos"></tbody>
    </table>

</section>

<script src="js/api.js"></script>
    <script src="js/menu.js"></script>
<script src="js/notificaciones.js"></script>
<script src="js/mantenimiento.js"></script>

</body>
</html>
