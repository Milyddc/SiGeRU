<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contenedor | SiGeRU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<video class="video-fondo" autoplay muted loop playsinline>
    <source src="video/montevideo.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<header>
    <div class="logo">
    <a href="/">
        <img class="logo-img" src="sigerulogo.png" alt="SiGeRU">
    </a>
</div>

    <nav>
        <a href="contenedores.html">Volver</a>
    </nav>
</header>

<section class="login-container">

    <div class="login-card">

        <h1 id="tituloFormulario">Nuevo Contenedor</h1>

        <form id="contenedorForm">

            <div class="input-group">
                <label for="codigo">Código</label>
                <input type="text" id="codigo" required>
            </div>

            <div class="input-group">
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion" required>
            </div>

            <div class="input-group">
                <label for="estado">Estado</label>
                <select id="estado" required>
                    <option value="Disponible">Disponible</option>
                    <option value="Lleno">Lleno</option>
                    <option value="Fuera de Servicio">Fuera de Servicio</option>
                </select>
            </div>

            <div class="input-group">
                <label for="capacidad">Capacidad</label>
                <input type="number" id="capacidad" required>
            </div>

            <div class="input-group">
                <label for="id_tipo_residuo">Tipo de Residuo</label>
                <select id="id_tipo_residuo" required>
                    <option value="1">Orgánico</option>
                    <option value="2">Reciclable</option>
                    <option value="3">Vidrio</option>
                    <option value="4">Plástico</option>
                    <option value="5">Papel y Cartón</option>
                    <option value="6">No reciclable</option>
                </select>
            </div>

            <div class="input-group">
                <label for="zona">Zona</label>
                <input type="text" id="zona" placeholder="Centro, Oeste, Norte...">
            </div>

            <div class="input-group">
                <label for="latitud">Latitud (para el mapa)</label>
                <input type="number" id="latitud" step="any" placeholder="-34.9011">
            </div>

            <div class="input-group">
                <label for="longitud">Longitud (para el mapa)</label>
                <input type="number" id="longitud" step="any" placeholder="-56.1645">
            </div>

            <div class="input-group">
                <label for="id_ruta">Ruta</label>
                <select id="id_ruta">
                    <option value="">Sin ruta</option>
                </select>
            </div>

            <div class="input-group">
                <label for="id_centro_acopio">Centro de Acopio (opcional)</label>
                <select id="id_centro_acopio">
                    <option value="">Sin asignar</option>
                </select>
            </div>

            <button type="submit" class="btn-login">
                Guardar Contenedor
            </button>

        </form>

    </div>

</section>

<script src="js/api.js"></script>
    <script src="js/notificaciones.js"></script>
    <script src="js/contenedorform.js"></script>

</body>
</html>
