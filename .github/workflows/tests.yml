name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar la base de datos de pruebas
        run: docker compose -f docker-compose.test.yml up -d --wait db-test

      - name: Tests api-usuarios
        run: docker compose -f docker-compose.test.yml run --rm --build test-usuarios

      - name: Tests api-gestion
        run: docker compose -f docker-compose.test.yml run --rm --build test-gestion

      - name: Tests api-recoleccion
        run: docker compose -f docker-compose.test.yml run --rm --build test-recoleccion

      - name: Limpiar
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
