resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/usuarios/login.php {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include proxy_params.conf;
        set $destino http://api-usuarios;
        rewrite ^ /login.php break;
        proxy_pass $destino;
    }

    location /api/usuarios/ {
        include proxy_params.conf;
        set $destino http://api-usuarios;
        rewrite ^/api/usuarios/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    location /api/gestion/ {
        include proxy_params.conf;
        set $destino http://api-gestion;
        rewrite ^/api/gestion/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    location /api/recoleccion/ {
        include proxy_params.conf;
        set $destino http://api-recoleccion;
        rewrite ^/api/recoleccion/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    location = /app {
        return 301 /app/login.html;
    }

    location = /app/ {
        return 302 /app/login.html;
    }

    location /app/ {
        include proxy_params.conf;
        set $destino http://frontend;
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    location / {
        include proxy_params.conf;
        set $destino http://landing;
        proxy_pass $destino;
    }
}
