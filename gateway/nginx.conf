# Puerta de entrada única: un solo origen para landing, aplicación y APIs.
# (Acá se agrega HTTPS/SSL en la parte de Ciberseguridad.)

# Resolución de nombres de Docker en cada pedido: si una aplicación todavía no arrancó (o se cayó),
# el gateway sigue en pie y responde 502 solo para esa parte, en lugar de fallar al iniciar.
resolver 127.0.0.11 valid=10s ipv6=off;

# Límite de intentos de login por IP (defensa contra fuerza bruta, complementa el bloqueo de cuenta)
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Los mapas de OpenStreetMap exigen el origen en el Referer; "no-referrer" los bloquearía.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- APIs (cada una es un contenedor independiente) ----
    location = /api/usuarios/login.php {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include proxy_params.conf;
        set $destino http://api-usuarios;
        rewrite ^ /login.php break;
        proxy_pass $destino;
    }

    location /api/usuarios/ {
        include proxy_params.conf;
        set $destino http://api-usuarios;
        rewrite ^/api/usuarios/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    location /api/gestion/ {
        include proxy_params.conf;
        set $destino http://api-gestion;
        rewrite ^/api/gestion/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    location /api/recoleccion/ {
        include proxy_params.conf;
        set $destino http://api-recoleccion;
        rewrite ^/api/recoleccion/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    # ---- Aplicación de usuarios (frontend) ----
    location = /app {
        return 301 /app/login.html;
    }

    location = /app/ {
        return 302 /app/login.html;
    }

    location /app/ {
        include proxy_params.conf;
        set $destino http://frontend;
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    # ---- Landing page ----
    location / {
        include proxy_params.conf;
        set $destino http://landing;
        proxy_pass $destino;
    }
}
