<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SiGeRU | Iniciar Sesión</title>

<link rel="stylesheet" href="style.css">


</head>

<body>

<video class="video-fondo" autoplay muted loop playsinline>
    <source src="video/montevideo.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<header>

    <div class="logo">
    <a href="index.html">
        <img class="logo-img" src="sigerulogo.png" alt="SiGeRU">
    </a>
</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="registro.html">Registro</a>
    </nav>

</header>

<div class="login-container">

    <div class="login-card">

        <h1>Iniciar Sesión</h1>

        <form id="loginForm">

            <div class="input-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingrese su correo"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    required
                >

            </div>

            <button type="submit" class="btn-login">
                Ingresar
            </button>

        </form>

        <div class="register-link">

            ¿No tenés una cuenta?

            <a href="registro.html">
                Registrate
            </a>

        </div>

    </div>

</div>

<script src="js/login.js"></script>


</body>

</html>
