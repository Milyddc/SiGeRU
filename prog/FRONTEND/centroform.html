<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Centro de Acopio | SiGeRU</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<video class="video-fondo" autoplay muted loop playsinline>
    <source src="video/montevideo.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<header>

    <div class="logo">
    <a href="index.html">
        <img class="logo-img" src="sigerulogo.png" alt="SiGeRU">
    </a>
</div>

    <nav>

        <a href="centros.html">
            Volver
        </a>

    </nav>

</header>

<section class="login-container">

    <div class="login-card">

        <h1 id="tituloFormulario">
            Nuevo Centro de Acopio
        </h1>

        <form id="centroForm">

            <div class="input-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    required
                >

            </div>

            <div class="input-group">

                <label for="direccion">
                    Dirección
                </label>

                <input
                    type="text"
                    id="direccion"
                    required
                >

            </div>

            <div class="input-group">

                <label for="capacidad">
                    Capacidad
                </label>

                <input
                    type="number"
                    id="capacidad"
                    min="0"
                    required
                >

            </div>

            <button type="submit" class="btn-login">
                Guardar Centro
            </button>

        </form>

    </div>

</section>

<script src="js/centros.js"></script>

</body>
</html>
