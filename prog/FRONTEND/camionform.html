<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo Camión | SiGeRU</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<video class="video-fondo" autoplay muted loop playsinline>
    <source src="video/montevideo.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<header>

    <div class="logo">
    <a href="index.html">
        <img class="logo-img" src="sigerulogo.png" alt="SiGeRU">
    </a>
</div>

    <nav>

        <a href="camiones.html">
            Volver
        </a>

    </nav>

</header>

<section class="login-container">

    <div class="login-card">

        <h1 id="tituloFormulario">
            Nuevo Camión
        </h1>

        <form id="camionForm">

            <div class="input-group">

                <label>
                    Matrícula
                </label>

                <input type="text" id="matricula" required>

            </div>

            <div class="input-group">

                <label>
                    Modelo
                </label>

                <input type="text" id="modelo">

            </div>

            <div class="input-group">

                <label>
                    Capacidad (kg)
                </label>

                <input type="number" id="capacidad" step="0.01" required>

            </div>

            <div class="input-group">

                <label>
                    Cuadrilla
                </label>

                <select id="id_cuadrilla" required>

                    <option value="1">
                        Cuadrilla 1
                    </option>

                    <option value="2">
                        Cuadrilla 2
                    </option>

                    <option value="3">
                        Cuadrilla 3
                    </option>

                </select>

            </div>

            <div class="input-group">

                <label>
                    Estado
                </label>

                <select id="estado">

                    <option>
                        Disponible
                    </option>

                    <option>
                        En mantenimiento
                    </option>

                    <option>
                        Fuera de Servicio
                    </option>

                </select>

            </div>

            <button type="submit" class="btn-login">
                Guardar Camión
            </button>

        </form>

    </div>

</section>

<script src="js/camionform.js"></script>

</body>
</html>
