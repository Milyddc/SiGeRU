
<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGeRU | Registro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<video class="video-fondo" autoplay muted loop playsinline>
    <source src="video/montevideo.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<header>

    <div class="logo">
    <a href="index.html">
        <img class="logo-img" src="sigerulogo.png" alt="SiGeRU">
    </a>
</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="login.html">Ingresar</a>
    </nav>

</header>

<div class="login-container">

    <div class="login-card">

        <h1>Crear Cuenta</h1>

        <form id="registroForm">

            <div class="input-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingrese su nombre"
                    required
                >

            </div>

            <div class="input-group">

                <label for="apellido">
                    Apellido
                </label>

                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Ingrese su apellido"
                    required
                >

            </div>

            <div class="input-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingrese su correo"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese una contraseña"
                    required
                >

            </div>

            <div class="input-group">

                <label for="rol">
                    Rol
                </label>

                <select id="rol" name="rol" required>

                    <option value="">
                        Seleccione un rol
                    </option>

                    <option value="1">
                        Administrador
                    </option>

                    <option value="2">
                        Recolector
                    </option>

                    <option value="3">
                        Operador
                    </option>

                    <option value="4">
                        Vecino
                    </option>

                </select>

            </div>

            <button type="submit" class="btn-login">
                Registrarse
            </button>

        </form>

        <div class="register-link">

            ¿Ya tenés una cuenta?

            <a href="login.html">
                Iniciá sesión
            </a>

        </div>

    </div>

</div>

<script src="js/registro.js?v=3"></script>

</body>

</html>
